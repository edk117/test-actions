# Название workflow в GitHub Actions.
name: Build and Deploy Docker Image

# Запускаем workflow при пуше в main.
on:
  push:
    branches:
      - main

# Общие переменные для всех job.
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: latest
  CONTAINER_NAME: fastapi-time-api

jobs:
  # Собираем Docker-образ и пушим его в GHCR.
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    # Даем workflow право читать код и писать пакеты.
    permissions:
      contents: read
      packages: write

    # Передаем имя образа во вторую job.
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}

    steps:
      # Скачиваем код репозитория.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Приводим owner/repo к нижнему регистру для GHCR.
      - name: Prepare image name
        id: image
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Логинимся в GitHub Container Registry.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Собираем образ и отправляем его в registry.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}:${{ env.IMAGE_TAG }}

  # Подключаемся к серверу и запускаем свежий образ.
  deploy:
    name: Deploy image on remote server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # Настраиваем SSH-ключ для подключения к серверу.
      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      # Скачиваем образ на сервере и перезапускаем контейнер.
      - name: Pull and run image on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image_name }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' CONTAINER_NAME='$CONTAINER_NAME' bash -s" <<'REMOTE_COMMANDS'
          # Останавливаем выполнение при ошибке.
          set -e

          # Добавляем стандартные пути для non-interactive SSH-сессии.
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"

          # Находим Docker на сервере.
          DOCKER_BIN="$(command -v docker)"

          # Логинимся в GHCR на удаленном сервере.
          echo "$GHCR_TOKEN" | "$DOCKER_BIN" login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          # Скачиваем свежий образ.
          "$DOCKER_BIN" pull "$IMAGE_NAME:$IMAGE_TAG"

          # Останавливаем и удаляем старый контейнер, если он есть.
          "$DOCKER_BIN" stop "$CONTAINER_NAME" || true
          "$DOCKER_BIN" rm "$CONTAINER_NAME" || true

          # Запускаем новый контейнер.
          "$DOCKER_BIN" run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p 8000:8000 \
            "$IMAGE_NAME:$IMAGE_TAG"

          # Удаляем неиспользуемые Docker-образы.
          "$DOCKER_BIN" image prune -f
          REMOTE_COMMANDS
